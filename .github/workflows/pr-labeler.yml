name: Label PR by Title

on:
  pull_request_target:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number in this repository to verify'
        required: true
        type: string
      dry_run:
        description: 'Only log the matching label without applying it'
        default: true
        type: boolean

permissions:
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # Only inspect PR metadata; never check out or execute PR code here.
      - name: Add label matching PR title
        uses: actions/github-script@v7
        with:
          script: |
            let pr = context.payload.pull_request;
            const manual = context.eventName === 'workflow_dispatch';
            const dryRun = manual && String(context.payload.inputs.dry_run) !== 'false';
            if (manual) {
              const number = String(context.payload.inputs.pr_number).trim();
              if (!/^[1-9]\d*$/.test(number) || !Number.isSafeInteger(Number(number))) {
                throw new Error('pr_number must be a positive safe integer.');
              }
              const response = await github.rest.pulls.get({
                ...context.repo,
                pull_number: Number(number),
              });
              pr = response.data;
            }
            core.info(`Checking PR #${pr.number}: ${pr.title}`);
            const match = pr.title.trim().match(
              /^(bugfix|docs|test|optimize|feature|refactor)(?:\([^)]*\))?\s*:/i
            );
            if (!match) {
              core.info('PR title does not match a supported type.');
              return;
            }

            const labels = {
              bugfix: 'type: bug',
              docs: 'type: docs',
              test: 'type: test',
              optimize: 'type: optimize',
              feature: 'type: feature',
              refactor: 'type: refactor',
            };
            const label = labels[match[1].toLowerCase()];
            if (pr.labels.some(existing => existing.name === label)) {
              core.info(`PR already has label "${label}".`);
              return;
            }

            core.info(`Matched label "${label}"; dry_run=${dryRun}.`);
            if (dryRun) {
              return;
            }

            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: pr.number,
              labels: [label],
            });
